{% extends "base.html" %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="section-title">
      <p class="eyebrow">Рубрики</p>
      <h1>Все рубрики</h1>
    </div>
    <div class="categories-grid">
      {% for term in terms %}
      <a href="{{ term.permalink }}" class="categories-card">
        <h3>{{ term.name }}</h3>
        <span class="meta">{{ term.pages | length }} записей</span>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock content %}
